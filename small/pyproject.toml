[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-ocr-charspot-small"
version = "1.0.0"
description = "Japanese manga text-box OCR by character detection and learned reading order (11M parameters, no decoder)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Code: Apache-2.0; model weights: CC BY-NC-SA 4.0"}
dependencies = ["numpy", "Pillow"]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.17"]
cuda = ["torch>=2.1", "safetensors"]

[project.scripts]
manga-ocr-charspot-small = "manga_ocr_charspot_small.cli:main"

[tool.setuptools]
packages = ["manga_ocr_charspot_small", "manga_ocr_charspot_small.backends"]
